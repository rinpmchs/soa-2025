syntax = "proto3";
package statistics;

message PostStatsRequest {
string post_id = 1;
}

message PostStatsResponse {
int64 views = 1;
int64 likes = 2;
int64 comments = 3;
}

message DailyStat {
string date = 1; // YYYY-MM-DD
int64 count = 2;
}

message DailyStatsResponse {
repeated DailyStat stats = 1;
}

message TopRequest {
enum Metric {
METRIC_UNSPECIFIED = 0;
VIEWS = 1;
LIKES = 2;
COMMENTS = 3;
}
Metric metric = 1;
int32 limit = 2; // e.g. top N
}

message TopItem {
string id = 1;    // post_id or user_id
int64 count = 2;
}

message TopPostsResponse {
repeated TopItem posts = 1;
}

message TopUsersResponse {
repeated TopItem users = 1;
}

service Statistics {
rpc GetPostStats(PostStatsRequest) returns (PostStatsResponse);

rpc GetPostViewsDaily(PostStatsRequest) returns (DailyStatsResponse);

rpc GetPostLikesDaily(PostStatsRequest) returns (DailyStatsResponse);

rpc GetPostCommentsDaily(PostStatsRequest) returns (DailyStatsResponse);

rpc GetTopPosts(TopRequest) returns (TopPostsResponse);

rpc GetTopUsers(TopRequest) returns (TopUsersResponse);
}
