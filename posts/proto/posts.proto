syntax = "proto3";

package post;

import "google/protobuf/timestamp.proto";

message Post {
    string id = 1;
    string title = 2;
    string description = 3;
    string creator_id = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    bool is_private = 7;
    repeated string tags = 8;
}

message CreatePostRequest {
    string title = 1;
    string description = 2;
    string creator_id = 3;
    bool is_private = 4;
    repeated string tags = 5;
}

message CreatePostResponse {
    Post post = 1;
}

message GetPostRequest {
    string id = 1;
    string requester_id = 2; // private posts
}

message GetPostResponse {
    Post post = 1;
}

message DeletePostRequest {
    string id = 1;
    string requester_id = 2;
}

message DeletePostResponse {
    bool success = 1;
}

message UpdatePostRequest {
    string id = 1;
    string requester_id = 2;
    string title = 3;
    string description = 4;
    bool is_private = 5;
    repeated string tags = 6;
}

message UpdatePostResponse {
    Post post = 1;
}

message ListPostsRequest {
    int32 page = 1;
    int32 page_size = 2;
    string requester_id = 3; // hide others private posts
}

message ListPostsResponse {
    repeated Post posts = 1;
    int32 total = 2;
}

message LikePostRequest {
    string post_id = 1;
    string client_id = 2;
}

message LikePostResponse {}

message ViewPostRequest {
    string post_id = 1;
    string client_id = 2;
}

message ViewPostResponse {
    Post post = 1;
}

message CommentPostRequest {
    string post_id = 1;
    string client_id = 2;
    string text = 3;
}

message CommentPostResponse {}

message GetPostCommentsRequest {
    string post_id = 1;
    int32 page = 2;
    int32 limit = 3;
}

message Comment {
    string client_id = 1;
    string text = 2;
    string created_at = 3;
}

message GetPostCommentsResponse {
    repeated Comment comments = 1;
}

message RegisterClientRequest {
    string client_id = 1;
    string registered_at = 2;
}

message RegisterClientResponse {}

service PostService {
    rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
    rpc GetPost(GetPostRequest) returns (GetPostResponse);
    rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
    rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
    rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
    rpc LikePost (LikePostRequest) returns (LikePostResponse);
    rpc ViewPost (ViewPostRequest) returns (ViewPostResponse);
    rpc CommentPost (CommentPostRequest) returns (CommentPostResponse);
    rpc GetPostComments (GetPostCommentsRequest) returns (GetPostCommentsResponse);
    rpc RegisterClient (RegisterClientRequest) returns (RegisterClientResponse);
}
